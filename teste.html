<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Mapa com Marcador a Piscar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
  #map { height: 500px; width: 100%; }
</style>
</head>
<body>

<div id="map"></div>

<script>
let map = L.map('map').setView([38.7, -9.2], 7); // centro em Portugal
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const ocorrencias = [
  { lat: 38.7, lng: -9.2, estado: "Em Curso" },
  { lat: 39.0, lng: -8.5, estado: "Em Resolução" },
  { lat: 38.5, lng: -9.0, estado: "Em Curso" }
];

function getColor(estado){
  if(estado === "Em Curso") return "red";
  if(estado === "Em Resolução") return "blue";
  return "gray";
}

ocorrencias.forEach(o => {
  const marker = L.circleMarker([o.lat, o.lng], {
    radius: 8,
    color: getColor(o.estado),
    fillColor: getColor(o.estado),
    fillOpacity: 0.9
  }).addTo(map);

  if(o.estado === "Em Curso"){
    let visible = true;
    setInterval(() => {
      marker.setStyle({
        fillOpacity: visible ? 0.9 : 0.2,
        radius: visible ? 8 : 12
      });
      visible = !visible;
    }, 700);
  }
});
</script>

</body>
</html>
