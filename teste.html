<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Mapa com Ícone SVG a Piscar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
  #map { height: 500px; width: 100%; }
  /* Animação do ícone SVG */
  .blinking-icon circle {
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0% { fill-opacity: 1; r: 10; }
    50% { fill-opacity: 0.3; r: 14; }
    100% { fill-opacity: 1; r: 10; }
  }
</style>
</head>
<body>
<div id="map"></div>

<script>
let map = L.map('map').setView([38.7, -9.2], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// Marcadores de exemplo
const ocorrencias = [
  { lat: 38.7, lng: -9.2, estado: "Em Curso" },
  { lat: 39.0, lng: -8.5, estado: "Em Resolução" }
];

ocorrencias.forEach(o => {
  if(o.estado === "Em Curso"){
    // Criar ícone SVG animado
    const svgIcon = L.divIcon({
      className: 'blinking-icon',
      html: `<svg width="30" height="30" viewBox="0 0 30 30">
               <circle cx="15" cy="15" r="10" fill="red" />
             </svg>`,
      iconSize: [30,30],
      iconAnchor: [15,15]
    });
    L.marker([o.lat, o.lng], { icon: svgIcon }).addTo(map);
  } else {
    // Marcador normal
    L.circleMarker([o.lat, o.lng], { radius:8, color:'blue', fillColor:'blue', fillOpacity:0.9 }).addTo(map);
  }
});
</script>
</body>
</html>
