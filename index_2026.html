<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROCIV 2026</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script src="concelhosDistrito.js"></script>

<style>
body { margin:0; font-family:Arial; background:#f4f4f4; display:flex; flex-direction:column; min-height:100vh;}
header, footer { padding:15px; background:#111; color:#ffcc00; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
header h1, footer h1 { margin:0; font-size:1.5em; }
header .time, header .last-update { color:white; font-size:0.9em; }
footer .text { color:#ffcc00; font-size:0.9em; }

.cards { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:10px; }
.card { width:18%; min-width:160px; padding:15px; border-radius:8px; text-align:center; color:white; box-shadow:0 3px 6px rgba(0,0,0,0.2); transition:0.3s; }
.card i { font-size:1.6em; margin-bottom:6px; display:block; }

.gray{background:#333;}
.yellow{background:#FFD700;color:#000;}
.red{background:red;}
.blue{background:blue;}
.green{background:green;}

.glow { box-shadow:0 0 15px rgba(255,255,255,0.9); }

.filtros { width:95%; margin:10px auto; display:flex; flex-wrap:wrap; gap:10px;}
.filtros select{ padding:6px 10px; border-radius:4px;}

#map { height:400px; margin:10px; border-radius:6px; }

table { width:95%; margin:10px auto 20px; border-collapse:collapse; background:white;}
th,td{ padding:8px; border-bottom:1px solid #ddd;}
th{background:#111;color:white; text-align:left;}
td { vertical-align: middle; }

/* Badge para o estado */
.estado-badge {
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: bold;
  font-size:0.9em;
  display:inline-block;
  color:white;
}
.estado-despacho { background:#FFD700; color:#000; }
.estado-chegada { background:#FFA500; } /* Laranja */
.estado-vigilancia { background:#808080; } /* Cinzento */
.estado-curso { background:red; }
.estado-resolucao { background:blue; }
.estado-conclusao { background:green; }

/* Ícone pulsante mapa */
.blinking-icon circle{animation:pulse 1s infinite;}
@keyframes pulse{0%{fill-opacity:1;r:8;}50%{fill-opacity:0.3;r:12;}100%{fill-opacity:1;r:8;}}

/* Animações ícones */
.pulse{animation:pulseIcon 1.5s infinite;}
@keyframes pulseIcon{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}

.rotate-slow{animation:rotateIcon 4s linear infinite;}
.spin{animation:rotateIcon 2s linear infinite;}
@keyframes rotateIcon{from{transform:rotate(0);}to{transform:rotate(360deg);}}

.shake{animation:shakeIcon 1s infinite;}
@keyframes shakeIcon{0%,100%{transform:rotate(0);}25%{transform:rotate(-10deg);}50%{transform:rotate(10deg);}75%{transform:rotate(-10deg);}}

.bounce{animation:bounceIcon 2s infinite;}
@keyframes bounceIcon{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}

.slide{animation:slideIcon 3s infinite alternate;}
@keyframes slideIcon{from{transform:translateX(-3px);}to{transform:translateX(3px);}}

.pop{animation:popIcon 2s infinite;}
@keyframes popIcon{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
</style>
</head>

<body>

<header>
<h1>PROCIV 2026</h1>
<div>
<span class="time" id="currentTime"></span>
<span class="last-update" id="lastUpdate"></span>
</div>
</header>

<div class="cards">
<div class="card gray"><i class="fa-solid fa-triangle-exclamation pulse"></i><strong>Total</strong><h2 id="totalCount">0</h2></div>
<div class="card gray"><i class="fa-solid fa-users bounce"></i><strong>Operacionais</strong><h2 id="operacionaisCount">0</h2></div>
<div class="card gray"><i class="fa-solid fa-truck slide"></i><strong>Terrestres</strong><h2 id="terrestresCount">0</h2></div>
<div class="card gray"><i class="fa-solid fa-helicopter rotate-slow"></i><strong>Aéreos</strong><h2 id="aereosCount">0</h2></div>
<div class="card yellow"><i class="fa-solid fa-bell shake"></i><strong>1º Alerta</strong><h2 id="alertCount">0</h2></div>
<div class="card orange"><i class="fa-solid fa-location-dot pulse"></i><strong>Chegada TO</strong><h2 id="chegadaCount">0</h2></div>
<div class="card gray"><i class="fa-solid fa-eye"></i><strong>Vigilância</strong><h2 id="vigilanciaCount">0</h2></div>
<div class="card red"><i class="fa-solid fa-fire pulse"></i><strong>Em Curso</strong><h2 id="cursoCount">0</h2></div>
<div class="card blue"><i class="fa-solid fa-spinner spin"></i><strong>Resolução</strong><h2 id="resolucaoCount">0</h2></div>
<div class="card green"><i class="fa-solid fa-circle-check pop"></i><strong>Conclusão</strong><h2 id="conclusaoCount">0</h2></div>
</div>

<div class="filtros">
<select id="filterEstado"><option value="">Todos Estados</option></select>
<select id="filterDistrito"><option value="">Todos Distritos</option></select>
<select id="filterConcelho"><option value="">Todos Concelhos</option></select>
<select id="filterNatureza"><option value="">Todas Naturezas</option></select>
</div>

<div id="map"></div>

<table>
<thead>
<tr>
<th>Data</th><th>Estado</th><th>Distrito</th><th>Concelho</th>
<th>Natureza</th><th>Operacionais</th><th>Terrestres</th><th>Aéreos</th>
</tr>
</thead>
<tbody id="tabelaBody"></tbody>
</table>

<footer>
<h1></h1>
<div class="text">Fonte de dados: ANEPC</div>
</footer>

<script>
// API e mapa
const API_URL="https://services-eu1.arcgis.com/VlrHb7fn5ewYhX6y/arcgis/rest/services/OcorrenciasSite/FeatureServer/0/query?f=geojson&where=1=1&outFields=*";
let map=L.map('map').setView([39.5,-8],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers=L.markerClusterGroup();map.addLayer(markers);

let allData=[];
let previousValues={total:0,alerta:0,chegada:0,vigilancia:0,curso:0,resolucao:0,conclusao:0,operacionais:0,terrestres:0,aereos:0};

function getDistrito(nome){
  const e=concelhosDistrito.find(c=>c.municipio.toLowerCase()===nome?.toLowerCase());
  return e?e.distrito:"Desconhecido";
}

function getEstadoClass(estado){
  switch(estado){
    case "Despacho de 1º Alerta": return "estado-despacho";
    case "Chegada ao TO": return "estado-chegada";
    case "Vigilância": return "estado-vigilancia";
    case "Em Curso": return "estado-curso";
    case "Em Resolução": return "estado-resolucao";
    case "Em Conclusão": return "estado-conclusao";
    default: return "";
  }
}

// Funções de contagem e animação
function animateCounter(id,start,end,duration=800){
  const el=document.getElementById(id);let startTime=null;
  function step(t){if(!startTime)startTime=t;
    let p=Math.min((t-startTime)/duration,1);
    el.textContent=Math.floor(start+(end-start)*p);
    if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

function updateCard(id,newVal,oldVal){
  animateCounter(id,oldVal,newVal);
  const card=document.getElementById(id).closest(".card");
  if(newVal>oldVal){card.classList.add("glow");setTimeout(()=>card.classList.remove("glow"),1500);}
}

function toggleAnimations(curso,alerta,aereos){
  document.querySelector(".fa-fire").style.animation=curso>0?"pulse":"none";
  document.querySelector(".fa-bell").style.animation=alerta>0?"shake":"none";
  document.querySelector(".fa-helicopter").style.animation=aereos>0?"rotate-slow":"none";
}

// Render mapa
function renderMap(data){
  markers.clearLayers();
  data.forEach(f=>{
    if(!f.geometry) return;
    const [lng,lat]=f.geometry.coordinates;
    const p=f.properties;
    let layer;
    if(p.EstadoOcorrencia==="Em Curso"){
      const icon=L.divIcon({className:'blinking-icon',
        html:`<svg width="30" height="30"><circle cx="15" cy="15" r="8" fill="red"/></svg>`,
        iconSize:[30,30],iconAnchor:[15,15]});
      layer=L.marker([lat,lng],{icon});
    }else{
      layer=L.circleMarker([lat,lng],{radius:8,color:"blue",fillOpacity:0.9});
    }
    layer.bindPopup(`<b>${p.Natureza||""}</b><br>Estado: ${p.EstadoOcorrencia||""}<br>Distrito: ${getDistrito(p.Concelho)}<br>Concelho: ${p.Concelho||""}<br>Operacionais:${p.Operacionais||0}<br>Terrestres:${p.MeiosTerrestres||0}<br>Aéreos:${p.MeiosAereos||0}`);
    markers.addLayer(layer);
  });
}

// Render tabela
function renderTable(data){
  const tbody=document.getElementById("tabelaBody");
  tbody.innerHTML="";
  data.forEach(f=>{
    const p=f.properties;
    const tr=document.createElement("tr");
    const estadoClass=getEstadoClass(p.EstadoOcorrencia);
    tr.innerHTML=`<td>${p.DataInicioOcorrencia||""}</td>
<td><span class="estado-badge ${estadoClass}">${p.EstadoOcorrencia||""}</span></td>
<td>${getDistrito(p.Concelho)}</td>
<td>${p.Concelho||""}</td>
<td>${p.Natureza||""}</td>
<td>${p.Operacionais||0}</td>
<td>${p.MeiosTerrestres||0}</td>
<td>${p.MeiosAereos||0}</td>`;
    tbody.appendChild(tr);
  });
}

// Dashboard
function renderDashboard(data){
  const total=data.length;
  const alerta=data.filter(f=>f.properties.EstadoOcorrencia==="Despacho de 1º Alerta").length;
  const chegada=data.filter(f=>f.properties.EstadoOcorrencia==="Chegada ao TO").length;
  const vigilancia=data.filter(f=>f.properties.EstadoOcorrencia==="Vigilância").length;
  const curso=data.filter(f=>f.properties.EstadoOcorrencia==="Em Curso").length;
  const resolucao=data.filter(f=>f.properties.EstadoOcorrencia==="Em Resolução").length;
  const conclusao=data.filter(f=>f.properties.EstadoOcorrencia==="Em Conclusão").length;
  const operacionais=data.reduce((s,f)=>s+(f.properties.Operacionais||0),0);
  const terrestres=data.reduce((s,f)=>s+(f.properties.MeiosTerrestres||0),0);
  const aereos=data.reduce((s,f)=>s+(f.properties.MeiosAereos||0),0);

  updateCard("totalCount",total,previousValues.total);
  updateCard("alertCount",alerta,previousValues.alerta);
  updateCard("chegadaCount",chegada,previousValues.chegada);
  updateCard("vigilanciaCount",vigilancia,previousValues.vigilancia);
  updateCard("cursoCount",curso,previousValues.curso);
  updateCard("resolucaoCount",resolucao,previousValues.resolucao);
  updateCard("conclusaoCount",conclusao,previousValues.conclusao);
  updateCard("operacionaisCount",operacionais,previousValues.operacionais);
  updateCard("terrestresCount",terrestres,previousValues.terrestres);
  updateCard("aereosCount",aereos,previousValues.aereos);

  previousValues={total,alerta,chegada,vigilancia,curso,resolucao,conclusao,operacionais,terrestres,aereos};
  toggleAnimations(curso,alerta,aereos);
}

function render(data){
  renderDashboard(data);
  renderTable(data);
  renderMap(data);
  populateFilters(data);
}

// Filtros
function applyFilters(){
  const estado=document.getElementById("filterEstado").value;
  const distrito=document.getElementById("filterDistrito").value;
  const concelho=document.getElementById("filterConcelho").value;
  const natureza=document.getElementById("filterNatureza").value;

  const filtered=allData.filter(d=>{
    return (!estado || d.properties.EstadoOcorrencia===estado) &&
           (!distrito || getDistrito(d.properties.Concelho)===distrito) &&
           (!concelho || d.properties.Concelho===concelho) &&
           (!natureza || d.properties.Natureza===natureza);
  });
  render(filtered);
}

function populateFilters(data){
  function fillSelect(id, options, allText){
    const select=document.getElementById(id);
    const current=select.value;
    select.innerHTML=`<option value="">${allText}</option>`+options.map(o=>`<option value="${o}" ${o===current?'selected':''}>${o}</option>`).join('');
  }

  const estados=[...new Set(data.map(d=>d.properties.EstadoOcorrencia).filter(Boolean))];
  const distritos=[...new Set(data.map(d=>getDistrito(d.properties.Concelho)).filter(Boolean))];
  const concelhos=[...new Set(data.map(d=>d.properties.Concelho).filter(Boolean))];
  const naturezas=[...new Set(data.map(d=>d.properties.Natureza).filter(Boolean))];

  fillSelect("filterEstado", estados, "Todos Estados");
  fillSelect("filterDistrito", distritos, "Todos Distritos");
  fillSelect("filterConcelho", concelhos, "Todos Concelhos");
  fillSelect("filterNatureza", naturezas, "Todas Naturezas");
}

// Load
function load(){
  fetch(API_URL).then(r=>r.json()).then(d=>{
    allData=d.features;
    render(allData);
    document.getElementById("lastUpdate").textContent="Atualizado: "+new Date().toLocaleString("pt-PT");
  });
}

setInterval(()=>document.getElementById("currentTime").textContent=new Date().toLocaleString("pt-PT"),1000);
load();
setInterval(load,120000);

document.getElementById("filterEstado").addEventListener("change",applyFilters);
document.getElementById("filterDistrito").addEventListener("change",applyFilters);
document.getElementById("filterConcelho").addEventListener("change",applyFilters);
document.getElementById("filterNatureza").addEventListener("change",applyFilters);

</script>

</body>
</html>
