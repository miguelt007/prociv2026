<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PROCIV 2026</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family: Arial, sans-serif; display:flex; height:100vh; }

#sidebar {
  width:360px;
  background:#111;
  color:white;
  padding:15px;
  overflow-y:auto;
}

h2 { margin-top:0; color:#ff3c3c; }

select {
  width:100%;
  padding:8px;
  margin-bottom:10px;
}

.counter {
  background:#1e1e1e;
  padding:10px;
  margin-bottom:15px;
  border-radius:6px;
}

.card {
  background:#1e1e1e;
  padding:10px;
  margin-bottom:10px;
  border-radius:6px;
  cursor:pointer;
}

.card:hover { background:#2a2a2a; }

#map { flex:1; }

.legend {
  margin-top:15px;
  font-size:14px;
}
.dot {
  height:12px;
  width:12px;
  display:inline-block;
  border-radius:50%;
  margin-right:5px;
}
.red { background:red; }
.orange { background:orange; }
.green { background:green; }

@media(max-width:900px){
  body{flex-direction:column;}
  #sidebar{width:100%; height:40vh;}
  #map{height:60vh;}
}
</style>
</head>

<body>

<div id="sidebar">
  <h2>🔥 PROCIV 2026</h2>

  <div class="counter">
    Total: <span id="totalCount">0</span><br>
    Ativos: <span id="activeCount">0</span>
  </div>

  <select id="estadoFilter">
    <option value="todos">Todos Estados</option>
  </select>

  <select id="distritoFilter">
    <option value="todos">Todos Distritos</option>
  </select>

  <select id="concelhoFilter">
    <option value="todos">Todos Concelhos</option>
  </select>

  <div id="lista"></div>

  <div class="legend">
    <strong>Legenda:</strong><br>
    <span class="dot red"></span>Ativo<br>
    <span class="dot orange"></span>Em Curso<br>
    <span class="dot green"></span>Encerrado
  </div>
</div>

<div id="map"></div>

<script>
const API_URL = "https://services-eu1.arcgis.com/VlrHb7fn5ewYhX6y/arcgis/rest/services/OcorrenciasSite/FeatureServer/0/query?f=geojson&where=1=1&outFields=*";

const map = L.map('map').setView([39.5,-8],7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let markersLayer = L.layerGroup().addTo(map);
let allData = [];

function getColor(estado){
  if(!estado) return "blue";
  estado = estado.toLowerCase();
  if(estado.includes("ativo")) return "red";
  if(estado.includes("curso")) return "orange";
  if(estado.includes("encerr")) return "green";
  return "blue";
}

function loadData(){
  fetch(API_URL)
  .then(res=>res.json())
  .then(data=>{
    allData = data.features;
    populateFilters();
    applyFilters();
  });
}

function populateFilters(){
  const estados = [...new Set(allData.map(f=>f.properties.Estado))];
  const distritos = [...new Set(allData.map(f=>f.properties.Distrito))];

  const estadoSelect = document.getElementById("estadoFilter");
  const distritoSelect = document.getElementById("distritoFilter");

  estados.forEach(e=>{
    if(e){
      const opt=document.createElement("option");
      opt.value=e;
      opt.textContent=e;
      estadoSelect.appendChild(opt);
    }
  });

  distritos.forEach(d=>{
    if(d){
      const opt=document.createElement("option");
      opt.value=d;
      opt.textContent=d;
      distritoSelect.appendChild(opt);
    }
  });
}

function applyFilters(){
  const estado = document.getElementById("estadoFilter").value;
  const distrito = document.getElementById("distritoFilter").value;
  const concelho = document.getElementById("concelhoFilter").value;

  let filtered = allData;

  if(estado !== "todos")
    filtered = filtered.filter(f=>f.properties.Estado===estado);

  if(distrito !== "todos")
    filtered = filtered.filter(f=>f.properties.Distrito===distrito);

  if(concelho !== "todos")
    filtered = filtered.filter(f=>f.properties.Concelho===concelho);

  render(filtered);
}

function render(data){
  markersLayer.clearLayers();
  const lista = document.getElementById("lista");
  lista.innerHTML="";

  document.getElementById("totalCount").textContent=data.length;
  document.getElementById("activeCount").textContent=
    data.filter(f=>f.properties.Estado?.toLowerCase().includes("ativo")).length;

  data.forEach(f=>{
    const p=f.properties;
    const [lng,lat]=f.geometry.coordinates;

    const marker=L.circleMarker([lat,lng],{
      radius:8,
      color:getColor(p.Estado),
      fillOpacity:0.8
    }).addTo(markersLayer);

    marker.bindPopup(`
      <b>${p.Natureza||''}</b><br>
      Estado: ${p.Estado||''}<br>
      Distrito: ${p.Distrito||''}<br>
      Concelho: ${p.Concelho||''}<br>
      Freguesia: ${p.Freguesia||''}<br>
      Localização: ${p.Localizacao||''}<br>
      Data Criação: ${p.DataCriacao||''}<br>
      Data Atualização: ${p.DataAtualizacao||''}<br>
      Operacionais: ${p.Operacionais||0}<br>
      Terrestres: ${p.Terrestres||0}<br>
      Aéreos: ${p.Aereos||0}
    `);

    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <strong>${p.Natureza||''}</strong><br>
      ${p.Concelho||''} - ${p.Distrito||''}<br>
      Estado: ${p.Estado||''}
    `;
    card.onclick=()=>{
      map.setView([lat,lng],12);
      marker.openPopup();
    };
    lista.appendChild(card);
  });

  updateConcelhos(data);
}

function updateConcelhos(data){
  const concelhos=[...new Set(data.map(f=>f.properties.Concelho))];
  const concelhoSelect=document.getElementById("concelhoFilter");
  concelhoSelect.innerHTML='<option value="todos">Todos Concelhos</option>';

  concelhos.forEach(c=>{
    if(c){
      const opt=document.createElement("option");
      opt.value=c;
      opt.textContent=c;
      concelhoSelect.appendChild(opt);
    }
  });
}

document.getElementById("estadoFilter").addEventListener("change",applyFilters);
document.getElementById("distritoFilter").addEventListener("change",applyFilters);
document.getElementById("concelhoFilter").addEventListener("change",applyFilters);

loadData();
setInterval(loadData,120000);
</script>

</body>
</html>
