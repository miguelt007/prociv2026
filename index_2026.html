<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Monitorização de Ocorrências</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>

body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f1f5f9;
}

/* ===== DASHBOARD ===== */

.dashboard {
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  padding:15px;
}

.card {
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  text-align:center;
  position:relative;
  transition:0.3s;
}

.card h3 {
  margin:5px 0;
  font-size:14px;
  color:#555;
}

.card span {
  font-size:22px;
  font-weight:bold;
}

.card i {
  font-size:20px;
  margin-bottom:5px;
}

/* Glow quando aumenta */
.glow {
  box-shadow:0 0 15px rgba(0,123,255,0.9);
}

/* Animações */
@keyframes pulse {
  0%{transform:scale(1);}
  50%{transform:scale(1.2);}
  100%{transform:scale(1);}
}

@keyframes shake {
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-3px);}
  75%{transform:translateX(3px);}
}

@keyframes spin {
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

.pulse { animation:pulse 1.2s infinite; }
.shake { animation:shake 0.8s infinite; }
.spin { animation:spin 2s linear infinite; }

/* ===== FILTROS ===== */

.filters {
  display:flex;
  gap:10px;
  padding:10px 15px;
  background:white;
  flex-wrap:wrap;
}

.filters select {
  padding:5px;
}

/* ===== MAPA ===== */

#map {
  height:400px;
}

/* ===== TABELA ===== */

table {
  width:100%;
  border-collapse:collapse;
  background:white;
  font-size:14px;
}

th {
  background:#1e293b;
  color:white;
  padding:8px;
  text-align:left;
}

td {
  padding:6px 8px;
  border-bottom:1px solid #ddd;
}

/* Cores por estado */

.estado-alerta {
  background:#fff3cd;
  color:#856404;
  font-weight:bold;
}

.estado-curso {
  background:#f8d7da;
  color:#721c24;
  font-weight:bold;
}

.estado-resolucao {
  background:#d1ecf1;
  color:#0c5460;
  font-weight:bold;
}

.estado-conclusao {
  background:#d4edda;
  color:#155724;
  font-weight:bold;
}

</style>
</head>

<body>

<!-- DASHBOARD -->
<div class="dashboard">
  <div class="card"><i class="fa-solid fa-list"></i><h3>Total</h3><span id="totalCount">0</span></div>
  <div class="card"><i class="fa-solid fa-bell shake"></i><h3>1º Alerta</h3><span id="alertCount">0</span></div>
  <div class="card"><i class="fa-solid fa-fire pulse"></i><h3>Em Curso</h3><span id="cursoCount">0</span></div>
  <div class="card"><i class="fa-solid fa-water"></i><h3>Em Resolução</h3><span id="resolucaoCount">0</span></div>
  <div class="card"><i class="fa-solid fa-check"></i><h3>Em Conclusão</h3><span id="conclusaoCount">0</span></div>
  <div class="card"><i class="fa-solid fa-users"></i><h3>Operacionais</h3><span id="operacionaisCount">0</span></div>
  <div class="card"><i class="fa-solid fa-truck"></i><h3>Meios Terrestres</h3><span id="terrestresCount">0</span></div>
  <div class="card"><i class="fa-solid fa-helicopter spin"></i><h3>Meios Aéreos</h3><span id="aereosCount">0</span></div>
</div>

<!-- FILTROS -->
<div class="filters">
  <select id="estadoFilter">
    <option value="">Todos Estados</option>
    <option>Despacho de 1º Alerta</option>
    <option>Em Curso</option>
    <option>Em Resolução</option>
    <option>Em Conclusão</option>
  </select>
</div>

<!-- MAPA -->
<div id="map"></div>

<!-- TABELA -->
<table>
<thead>
<tr>
  <th>Natureza</th>
  <th>Distrito</th>
  <th>Concelho</th>
  <th>Estado</th>
  <th>Operacionais</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([39.5,-8],7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
}).addTo(map);

let previousValues = {
  total:0, alerta:0, curso:0,
  resolucao:0, conclusao:0,
  operacionais:0, terrestres:0, aereos:0
};

function animateCounter(id,start,end,duration=800){
  const el=document.getElementById(id);
  let startTime=null;
  function step(timestamp){
    if(!startTime) startTime=timestamp;
    const progress=timestamp-startTime;
    const percent=Math.min(progress/duration,1);
    el.textContent=Math.floor(start+(end-start)*percent);
    if(percent<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function updateCard(id,newVal,oldVal){
  animateCounter(id,oldVal,newVal);
  const card=document.getElementById(id).closest(".card");
  if(newVal>oldVal){
    card.classList.add("glow");
    setTimeout(()=>card.classList.remove("glow"),1500);
  }
}

function getEstadoClass(estado){
  switch(estado){
    case "Despacho de 1º Alerta": return "estado-alerta";
    case "Em Curso": return "estado-curso";
    case "Em Resolução": return "estado-resolucao";
    case "Em Conclusão": return "estado-conclusao";
    default: return "";
  }
}

async function loadData(){

  const res = await fetch("/api/ocorrencias");
  const json = await res.json();
  const data = json.features || [];

  document.getElementById("tableBody").innerHTML="";

  data.forEach(f=>{

    const row=document.createElement("tr");
    const estadoClass=getEstadoClass(f.properties.EstadoOcorrencia);

    row.innerHTML=`
      <td>${f.properties.Natureza}</td>
      <td>${f.properties.Distrito}</td>
      <td>${f.properties.Concelho}</td>
      <td class="${estadoClass}">${f.properties.EstadoOcorrencia}</td>
      <td>${f.properties.Operacionais||0}</td>
    `;

    document.getElementById("tableBody").appendChild(row);
  });

  const total=data.length;
  const alerta=data.filter(f=>f.properties.EstadoOcorrencia==="Despacho de 1º Alerta").length;
  const curso=data.filter(f=>f.properties.EstadoOcorrencia==="Em Curso").length;
  const resolucao=data.filter(f=>f.properties.EstadoOcorrencia==="Em Resolução").length;
  const conclusao=data.filter(f=>f.properties.EstadoOcorrencia==="Em Conclusão").length;

  const operacionais=data.reduce((s,f)=>s+(f.properties.Operacionais||0),0);
  const terrestres=data.reduce((s,f)=>s+(f.properties.MeiosTerrestres||0),0);
  const aereos=data.reduce((s,f)=>s+(f.properties.MeiosAereos||0),0);

  updateCard("totalCount",total,previousValues.total);
  updateCard("alertCount",alerta,previousValues.alerta);
  updateCard("cursoCount",curso,previousValues.curso);
  updateCard("resolucaoCount",resolucao,previousValues.resolucao);
  updateCard("conclusaoCount",conclusao,previousValues.conclusao);
  updateCard("operacionaisCount",operacionais,previousValues.operacionais);
  updateCard("terrestresCount",terrestres,previousValues.terrestres);
  updateCard("aereosCount",aereos,previousValues.aereos);

  previousValues={total,alerta,curso,resolucao,conclusao,operacionais,terrestres,aereos};
}

loadData();
setInterval(loadData,60000);

</script>

</body>
</html>
