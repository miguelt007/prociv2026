<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Monitor ANEPC</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f9;
}

/* LARGURA GLOBAL FIXA */
.wrapper{
  width:1400px;
  margin:0 auto;
}

/* TOPO */
header{
  background:#1e293b;
  color:white;
  padding:15px;
  font-size:22px;
  font-weight:bold;
}

/* CARTÕES */
.top-container{
  display:flex;
  gap:15px;
  margin:15px 0;
}

.top-card{
  flex:1;
  background:white;
  padding:12px;
  border-radius:6px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  font-size:14px;
}

/* MAPA */
#map{
  height:400px;
  margin-bottom:15px;
  border-radius:6px;
}

/* TABELA */
table{
  width:100%;
  border-collapse:collapse;
  background:white;
  font-size:13px;
}

th{
  background:#1e293b;
  color:white;
  padding:8px;
}

td{
  padding:6px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

/* ESTADO - FUNDO DA PALAVRA */
.estado{
  padding:3px 8px;
  border-radius:4px;
  color:white;
  font-weight:bold;
}

.estado-curso{ background:red; }
.estado-resolucao{ background:green; }
.estado-conclusao{ background:gray; }

/* FOOTER */
footer{
  background:#1e293b;
  color:white;
  padding:10px;
  text-align:center;
  margin-top:15px;
}

/* PISCAR */
.blinking-icon{
  animation: blink 1s infinite;
}
@keyframes blink{
  0%{opacity:1;}
  50%{opacity:0.2;}
  100%{opacity:1;}
}
</style>
</head>

<body>

<div class="wrapper">

<header>Monitor de Ocorrências - ANEPC</header>

<div class="top-container" id="topCards"></div>

<div id="map"></div>

<table>
<thead>
<tr>
<th>Data</th>
<th>Distrito</th>
<th>Concelho</th>
<th>Natureza</th>
<th>Estado</th>
<th>Operacionais</th>
<th>Terrestres</th>
<th>Aéreos</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<footer>
Dados fornecidos pela ANEPC
</footer>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([39.5, -8], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
}).addTo(map);

const markers = L.layerGroup().addTo(map);

function getDistrito(concelho){
  return "-"; // mantém simples
}

function getEstadoClass(estado){
  if(!estado) return "";
  if(estado.includes("Curso")) return "estado-curso";
  if(estado.includes("Resolução")) return "estado-resolucao";
  if(estado.includes("Conclus")) return "estado-conclusao";
  return "";
}

async function loadData(){
  try{
    const response = await fetch("/api/anepec");
    const data = await response.json();

    // 🔥 CORREÇÃO IMPORTANTE
    const ocorrencias = data.features ? data.features : data;

    render(ocorrencias);

  }catch(e){
    console.error("Erro ao carregar dados:", e);
  }
}

function render(data){

  document.getElementById("tbody").innerHTML="";
  document.getElementById("topCards").innerHTML="";
  markers.clearLayers();

  if(!Array.isArray(data)) return;

  // TOP 3
  const top3 = [...data]
    .sort((a,b)=> (b.properties?.Operacionais||0) - (a.properties?.Operacionais||0))
    .slice(0,3);

  top3.forEach(f=>{
    const p=f.properties||{};
    const card=document.createElement("div");
    card.className="top-card";
    card.innerHTML=`
      <div><strong>${p.DataHora||"-"}</strong></div>
      <div>${p.Concelho||"-"}</div>
      <div>${p.Natureza||"-"}</div>
      <div>${p.EstadoOcorrencia||"-"}</div>
      <div><b>Operacionais:</b> ${p.Operacionais||0}</div>
    `;
    document.getElementById("topCards").appendChild(card);
  });

  // TABELA + MAPA
  data.forEach(f=>{
    const p=f.properties||{};

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${p.DataHora||"-"}</td>
      <td>-</td>
      <td>${p.Concelho||"-"}</td>
      <td>${p.Natureza||"-"}</td>
      <td>
        <span class="estado ${getEstadoClass(p.EstadoOcorrencia)}">
          ${p.EstadoOcorrencia||"-"}
        </span>
      </td>
      <td>${p.Operacionais||0}</td>
      <td>${p.MeiosTerrestres||0}</td>
      <td>${p.MeiosAereos||0}</td>
    `;
    document.getElementById("tbody").appendChild(tr);

    if(f.geometry && f.geometry.coordinates){
      const [lng,lat]=f.geometry.coordinates;

      const popupContent=`
        <strong>${p.Natureza||"Ocorrência"}</strong><br>
        Estado: ${p.EstadoOcorrencia||"-"}<br>
        Concelho: ${p.Concelho||"-"}<br>
        Operacionais: ${p.Operacionais||0}
      `;

      let marker;

      if(p.EstadoOcorrencia && p.EstadoOcorrencia.includes("Curso")){
        const icon=L.divIcon({
          className:'blinking-icon',
          html:`<svg width="30" height="30">
                  <circle cx="15" cy="15" r="8" fill="red"/>
                </svg>`,
          iconSize:[30,30],
          iconAnchor:[15,15]
        });
        marker=L.marker([lat,lng],{icon});
      } else {
        marker=L.circleMarker([lat,lng],{
          radius:8,
          color:"blue",
          fillOpacity:0.9
        });
      }

      marker.bindPopup(popupContent);
      markers.addLayer(marker);
    }

  });

}

loadData();

</script>
</body>
</html>
