<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROCIV 2026</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script src="concelhosDistrito.js"></script>

<style>
body { margin:0; font-family:Arial; background:#f4f4f4; display:flex; flex-direction:column; min-height:100vh; }

.wrapper { width:95%; max-width:1400px; margin:0 auto; display:flex; flex-direction:column; }

header, footer { padding:15px; background:#111; color:#ffcc00; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }

.cards { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:10px 0; }
.card { width:18%; min-width:160px; padding:15px; border-radius:8px; text-align:center; color:white; box-shadow:0 3px 6px rgba(0,0,0,0.2); transition:0.3s; }
.card i { font-size:1.6em; margin-bottom:6px; display:block; }
.gray{background:#333;} .yellow{background:#FFD700;color:#000;} .red{background:red;} .blue{background:blue;} .green{background:green;}
.glow { box-shadow:0 0 15px rgba(255,255,255,0.9); }

.filtros { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0;}
.filtros select{ padding:6px 10px; border-radius:4px; }

#map { height:400px; margin:10px 0; border-radius:6px; }

table { width:100%; border-collapse:collapse; background:white; table-layout: fixed; }
th, td { padding:8px; border-bottom:1px solid #ddd; text-align:left; word-wrap:break-word; }
th { background:#111; color:white; }

th.localidade, td.localidade { max-width:120px; white-space:normal; }
th.natureza, td.natureza { max-width:150px; white-space:normal; }

.estado-badge { display:inline-block; padding:2px 6px; border-radius:4px; color:white; font-weight:bold; font-size:0.9em; }
.estado-despacho1 { background:#FFD700; color:#000; }
.estado-emcurso   { background:red; }
.estado-resolucao { background:blue; }
.estado-conclusao { background:green; }
.estado-chegada   { background:orange; }
.estado-vigilancia{ background:gray; }

.top-ocorrencias { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:10px; }
.top-card { width:30%; min-width:200px; background:white; border-radius:8px; border:3px solid green; padding:12px; box-shadow:0 2px 6px rgba(0,0,0,0.15); transition:0.3s; }
.top-card h4 { margin:6px 0; font-size:1em; font-weight:bold; }
.top-card p { margin:3px 0; font-size:0.9em; }
@media(max-width:900px){ .top-card { width:45%; } }
@media(max-width:600px){ .top-card { width:90%; } }

/* Ícones animados */
.blinking-icon circle{animation:pulse 1s infinite;}
@keyframes pulse{0%{fill-opacity:1;r:8;}50%{fill-opacity:0.3;r:12;}100%{fill-opacity:1;r:8;}}
.pulse{animation:pulseIcon 1.5s infinite;}
@keyframes pulseIcon{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
.rotate-slow{animation:rotateIcon 4s linear infinite;}
.spin{animation:rotateIcon 2s linear infinite;}
@keyframes rotateIcon{from{transform:rotate(0);}to{transform:rotate(360deg);}}
.shake{animation:shakeIcon 1s infinite;}
@keyframes shakeIcon{0%,100%{transform:rotate(0);}25%{transform:rotate(-10deg);}50%{transform:rotate(10deg);}75%{transform:rotate(-10deg);}}
.bounce{animation:bounceIcon 2s infinite;}
@keyframes bounceIcon{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
.slide{animation:slideIcon 3s infinite alternate;}
@keyframes slideIcon{from{transform:translateX(-3px);}to{transform:translateX(3px);}}
.pop{animation:popIcon 2s infinite;}
@keyframes popIcon{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
</style>
</head>

<body>
<div class="wrapper">

<header>
<h1>PROCIV 2026</h1>
<div>
<span class="time" id="currentTime"></span>
<span class="last-update" id="lastUpdate"></span>
</div>
</header>

<div class="cards">
<div class="card gray"><i class="fa-solid fa-triangle-exclamation pulse"></i><strong>Total</strong><h2 id="totalCount">0</h2></div>
<div class="card gray"><i class="fa-solid fa-users bounce"></i><strong>Operacionais</strong><h2 id="operacionaisCount">0</h2></div>
<div class="card gray"><i class="fa-solid fa-truck slide"></i><strong>Terrestres</strong><h2 id="terrestresCount">0</h2></div>
<div class="card gray"><i class="fa-solid fa-helicopter rotate-slow"></i><strong>Aéreos</strong><h2 id="aereosCount">0</h2></div>
<div class="card yellow"><i class="fa-solid fa-bell shake"></i><strong>1º Alerta</strong><h2 id="alertCount">0</h2></div>
<div class="card red"><i class="fa-solid fa-fire pulse"></i><strong>Em Curso</strong><h2 id="cursoCount">0</h2></div>
<div class="card blue"><i class="fa-solid fa-spinner spin"></i><strong>Resolução</strong><h2 id="resolucaoCount">0</h2></div>
<div class="card green"><i class="fa-solid fa-circle-check pop"></i><strong>Conclusão</strong><h2 id="conclusaoCount">0</h2></div>
</div>

<div class="filtros">
<select id="filterEstado"><option value="">Todos Estados</option></select>
<select id="filterDistrito"><option value="">Todos Distritos</option></select>
<select id="filterConcelho"><option value="">Todos Concelhos</option></select>
<select id="filterNatureza"><option value="">Todas Naturezas</option></select>
</div>

<div class="top-ocorrencias" id="topOcorrencias"></div>
<div id="map"></div>

<table>
<thead>
<tr>
<th>Data Criação</th>
<th>Estado</th>
<th>Distrito</th>
<th>Concelho</th>
<th>Freguesia</th>
<th class="natureza">Natureza</th>
<th class="localidade">Localidade</th>
<th>Operacionais</th>
<th>Meios Terrestres</th>
<th>Meios Aéreos</th>
</tr>
</thead>
<tbody id="tabelaBody"></tbody>
</table>

<footer>
<div>Fonte de dados: ANEPC</div>
</footer>
</div>

<script>
// JS permanece igual (igual à versão anterior), mas tabela com word-wrap e table-layout fixed
// Mantendo badges de estado, top 3 ocorrências, animações e contadores
</script>

</body>
</html>
