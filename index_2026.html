<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROCIV 2026</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script src="concelhosDistrito.js"></script>

<style>
body { margin:0; font-family:Arial; background:#f4f4f4; display:flex; flex-direction:column; min-height:100vh; }
.wrapper { width:95%; max-width:1400px; margin:0 auto; display:flex; flex-direction:column; }

header, footer { padding:15px; background:#111; color:#ffcc00; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }

.cards { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:10px 0; }
.card { width:18%; min-width:160px; padding:15px; border-radius:8px; text-align:center; color:white; box-shadow:0 3px 6px rgba(0,0,0,0.2); transition:0.3s; }
.card i { font-size:1.6em; margin-bottom:6px; display:block; }
.gray{background:#333;} .yellow{background:#FFD700;color:#000;} .red{background:red;} .blue{background:blue;} .green{background:green;}
.glow { box-shadow:0 0 15px rgba(255,255,255,0.9); }

.filtros { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0;}
.filtros select{ padding:6px 10px; border-radius:4px; }

#map { height:500px; margin:10px 0; border-radius:6px; }

table { width:100%; border-collapse:collapse; background:white; table-layout: fixed; }
th, td { padding:8px; border-bottom:1px solid #ddd; text-align:left; word-wrap:break-word; }
th { background:#111; color:white; }
th.localidade, td.localidade { max-width:120px; white-space:normal; }
th.natureza, td.natureza { max-width:150px; white-space:normal; }

.estado-badge { display:inline-block; padding:2px 6px; border-radius:4px; color:white; font-weight:bold; font-size:0.9em; }
.estado-despacho1 { background:#FFD700; color:#000; }
.estado-emcurso   { background:red; }
.estado-resolucao { background:blue; }
.estado-conclusao { background:green; }
.estado-chegada   { background:orange; }
.estado-vigilancia{ background:gray; }

.top-ocorrencias { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:10px; }
.top-card { width:30%; min-width:200px; background:white; border-radius:8px; border:3px solid green; padding:12px; box-shadow:0 2px 6px rgba(0,0,0,0.15); transition:0.3s; }
.top-card h4 { margin:6px 0; font-size:1em; font-weight:bold; }
.top-card p { margin:3px 0; font-size:0.9em; }
@media(max-width:900px){ .top-card { width:45%; } }
@media(max-width:600px){ .top-card { width:90%; } }

/* Ícones animados */
.blinking-icon circle{animation:pulse 1s infinite;}
@keyframes pulse{0%{fill-opacity:1;r:8;}50%{fill-opacity:0.3;r:12;}100%{fill-opacity:1;r:8;}}
.pulse{animation:pulseIcon 1.5s infinite;}
@keyframes pulseIcon{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
.rotate-slow{animation:rotateIcon 4s linear infinite;}
.spin{animation:rotateIcon 2s linear infinite;}
@keyframes rotateIcon{from{transform:rotate(0);}to{transform:rotate(360deg);}}
.shake{animation:shakeIcon 1s infinite;}
@keyframes shakeIcon{0%,100%{transform:rotate(0);}25%{transform:rotate(-10deg);}50%{transform:rotate(10deg);}75%{transform:rotate(-10deg);}}
.bounce{animation:bounceIcon 2s infinite;}
@keyframes bounceIcon{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
.slide{animation:slideIcon 3s infinite alternate;}
@keyframes slideIcon{from{transform:translateX(-3px);}to{transform:translateX(3px);}}
.pop{animation:popIcon 2s infinite;}
@keyframes popIcon{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
</style>
</head>

<body>
<div class="wrapper">

<header>
<h1>PROCIV 2026</h1>
<div>
<span class="time" id="currentTime"></span> ||
<span class="last-update" id="lastUpdate"></span>
</div>
</header>

<div class="cards">
<div class="card gray"><i class="fa-solid fa-triangle-exclamation pulse"></i><strong>Total</strong><h2 id="totalCount">0</h2></div>
<div class="card gray"><i class="fa-solid fa-users bounce"></i><strong>Operacionais</strong><h2 id="operacionaisCount">0</h2></div>
<div class="card gray"><i class="fa-solid fa-truck slide"></i><strong>Terrestres</strong><h2 id="terrestresCount">0</h2></div>
<div class="card gray"><i class="fa-solid fa-helicopter rotate-slow"></i><strong>Aéreos</strong><h2 id="aereosCount">0</h2></div>
<div class="card yellow"><i class="fa-solid fa-bell shake"></i><strong>1º Alerta</strong><h2 id="alertCount">0</h2></div>
<div class="card red"><i class="fa-solid fa-fire pulse"></i><strong>Em Curso</strong><h2 id="cursoCount">0</h2></div>
<div class="card blue"><i class="fa-solid fa-spinner spin"></i><strong>Resolução</strong><h2 id="resolucaoCount">0</h2></div>
<div class="card green"><i class="fa-solid fa-circle-check pop"></i><strong>Conclusão</strong><h2 id="conclusaoCount">0</h2></div>
</div>

<div class="filtros">
<select id="filterEstado"><option value="">Todos Estados</option></select>
<select id="filterDistrito"><option value="">Todos Distritos</option></select>
<select id="filterConcelho"><option value="">Todos Concelhos</option></select>
<select id="filterNatureza"><option value="">Todas Naturezas</option></select>
</div>

<div class="top-ocorrencias" id="topOcorrencias"></div>
<div id="map"></div>

<table>
<thead>
<tr>
<th>Data Criação</th>
<th>Estado</th>
<th>Distrito</th>
<th>Concelho</th>
<th>Freguesia</th>
<th class="natureza">Natureza</th>
<th class="localidade">Local</th>
<th>OP</th>
<th>MT</th>
<th>MA</th>
</tr>
</thead>
<tbody id="tabelaBody"></tbody>
</table>

<footer>
<div>Fonte de dados: ANEPC</div>
</footer>
</div>

<script>
const API_URL="https://services-eu1.arcgis.com/VlrHb7fn5ewYhX6y/arcgis/rest/services/OcorrenciasSite/FeatureServer/0/query?f=geojson&where=1=1&outFields=*";

let map=L.map('map').setView([39.5,-8],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers=L.markerClusterGroup();
map.addLayer(markers);

let allData=[];

// Função para obter distrito
function getDistrito(nome){
  const e=concelhosDistrito.find(c=>c.municipio?.toLowerCase()===nome?.toLowerCase());
  return e ? e.distrito : "Desconhecido";
}

// Atualiza hora topo
setInterval(()=>document.getElementById("currentTime").textContent=new Date().toLocaleString("pt-PT"),1000);

// Função de contagem animada
function animateCounter(id,start,end,duration=800){
  const el=document.getElementById(id); let startTime=null;
  function step(t){if(!startTime) startTime=t; let p=Math.min((t-startTime)/duration,1); el.textContent=Math.floor(start+(end-start)*p); if(p<1) requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

// Renderização completa
function render(data){
  markers.clearLayers();

  // Dashboard
  let total=data.length;
  let alerta=data.filter(f=>f.properties.EstadoOcorrencia==="Despacho de 1º Alerta").length;
  let curso=data.filter(f=>f.properties.EstadoOcorrencia==="Em Curso").length;
  let resolucao=data.filter(f=>f.properties.EstadoOcorrencia==="Em Resolução").length;
  let conclusao=data.filter(f=>f.properties.EstadoOcorrencia==="Em Conclusão").length;
  let operacionais=data.reduce((s,f)=>s+(f.properties.Operacionais||0),0);
  let terrestres=data.reduce((s,f)=>s+(f.properties.MeiosTerrestres||0),0);
  let aereos=data.reduce((s,f)=>s+(f.properties.MeiosAereos||0),0);

  animateCounter("totalCount",0,total);
  animateCounter("alertCount",0,alerta);
  animateCounter("cursoCount",0,curso);
  animateCounter("resolucaoCount",0,resolucao);
  animateCounter("conclusaoCount",0,conclusao);
  animateCounter("operacionaisCount",0,operacionais);
  animateCounter("terrestresCount",0,terrestres);
  animateCounter("aereosCount",0,aereos);

  // Tabela
  const tbody=document.getElementById("tabelaBody");
  tbody.innerHTML="";
  data.forEach(f=>{
    const p=f.properties;
    const tr=document.createElement("tr");
    let estadoClass="";
    switch(p.EstadoOcorrencia){
      case "Despacho de 1º Alerta": estadoClass="estado-despacho1"; break;
      case "Em Curso": estadoClass="estado-emcurso"; break;
      case "Em Resolução": estadoClass="estado-resolucao"; break;
      case "Em Conclusão": estadoClass="estado-conclusao"; break;
      case "Chegada ao TO": estadoClass="estado-chegada"; break;
      case "Vigilância": estadoClass="estado-vigilancia"; break;
    }
    tr.innerHTML=`
      <td>${p.DataInicioOcorrencia||""}</td>
      <td><span class="estado-badge ${estadoClass}">${p.EstadoOcorrencia||""}</span></td>
      <td>${getDistrito(p.Concelho)}</td>
      <td>${p.Concelho||""}</td>
      <td>${p.Freguesia||""}</td>
      <td class="natureza">${p.Natureza||""}</td>
      <td class="localidade">${p.Localidade||""}</td>
      <td>${p.Operacionais||0}</td>
      <td>${p.MeiosTerrestres||0}</td>
      <td>${p.MeiosAéreos||0}</td>
    `;
    tbody.appendChild(tr);

    if(f.geometry){
      const [lng,lat]=f.geometry.coordinates;
      try{
        if(p.EstadoOcorrencia==="Em Curso"){
          const icon=L.divIcon({className:'blinking-icon',
            html:`<svg width="30" height="30"><circle cx="15" cy="15" r="8" fill="red"/></svg>`,
            iconSize:[30,30],iconAnchor:[15,15]
          });
          L.marker([lat,lng],{icon}).addTo(markers);
        } else {
          L.circleMarker([lat, lng], {radius:8, color:"blue", fillOpacity:0.9}).addTo(markers);
        }
      }catch(e){console.warn("Erro ao criar marcador:",e);}
    }
  });

  // Top 3 ocorrências
  const top= [...data].sort((a,b)=>(b.properties.Operacionais||0)-(a.properties.Operacionais||0)).slice(0,3);
  const topDiv=document.getElementById("topOcorrencias");
  topDiv.innerHTML="";
  top.forEach(f=>{
    const p=f.properties;
    const card=document.createElement("div");
    card.className="top-card";
    card.innerHTML=`
      <h4>${p.DataInicioOcorrencia||""}</h4>
      <p><strong>Distrito:</strong> ${getDistrito(p.Concelho)}</p>
      <p><strong>Concelho:</strong> ${p.Concelho||""}</p>
      <p><strong>Tipo:</strong> ${p.Natureza||""}</p>
      <p><strong>Estado:</strong> ${p.EstadoOcorrencia||""}</p>
      <p><strong>Operacionais:</strong> ${p.Operacionais||0}</p>
      <p><strong>Terrestres:</strong> ${p.MeiosTerrestres||0}</p>
      <p><strong>Aéreos:</strong> ${p.MeiosAereos||0}</p>
    `;
    topDiv.appendChild(card);
  });
}

// Load data
function load(){
  fetch(API_URL).then(r=>r.json()).then(d=>{
    allData=d.features||[];
    render(allData);
    document.getElementById("lastUpdate").textContent="Atualizado: "+new Date().toLocaleString("pt-PT");
    populateFilters();
  });
}

// Filtros
function populateFilters(){
  const fEstado=document.getElementById("filterEstado");
  const fDistrito=document.getElementById("filterDistrito");
  const fConcelho=document.getElementById("filterConcelho");
  const fNatureza=document.getElementById("filterNatureza");

  const estados=[...new Set(allData.map(f=>f.properties.EstadoOcorrencia).filter(Boolean))];
  const distritos=[...new Set(allData.map(f=>getDistrito(f.properties.Concelho)).filter(Boolean))];
  const concelhos=[...new Set(allData.map(f=>f.properties.Concelho).filter(Boolean))];
  const naturezas=[...new Set(allData.map(f=>f.properties.Natureza).filter(Boolean))];

  estados.forEach(e=>{ if(![...fEstado.options].some(opt=>opt.value===e)) fEstado.add(new Option(e,e)); });
  distritos.forEach(e=>{ if(![...fDistrito.options].some(opt=>opt.value===e)) fDistrito.add(new Option(e,e)); });
  concelhos.forEach(e=>{ if(![...fConcelho.options].some(opt=>opt.value===e)) fConcelho.add(new Option(e,e)); });
  naturezas.forEach(e=>{ if(![...fNatureza.options].some(opt=>opt.value===e)) fNatureza.add(new Option(e,e)); });
}

document.querySelectorAll(".filtros select").forEach(sel=>{
  sel.addEventListener("change",()=>{
    let filtered=allData;
    const e=document.getElementById("filterEstado").value;
    const d=document.getElementById("filterDistrito").value;
    const c=document.getElementById("filterConcelho").value;
    const n=document.getElementById("filterNatureza").value;
    if(e) filtered=filtered.filter(f=>f.properties.EstadoOcorrencia===e);
    if(d) filtered=filtered.filter(f=>getDistrito(f.properties.Concelho)===d);
    if(c) filtered=filtered.filter(f=>f.properties.Concelho===c);
    if(n) filtered=filtered.filter(f=>f.properties.Natureza===n);
    render(filtered);
  });
});

load();
setInterval(load,120000);
</script>
</body>
</html>
