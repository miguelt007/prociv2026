<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Ocorrências ANEPC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f9;
}

/* Container principal */
.container{
  width:95%;
  max-width:1400px;
  margin:0 auto;
}

/* Header */
header{
  background:#1f2937;
  color:white;
  padding:20px 0;
  text-align:center;
}

/* Cards */
.top-cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:20px 0;
}

.top-card{
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
  font-size:14px;
}

/* Mapa */
#map{
  height:400px;
  border-radius:10px;
  margin-bottom:20px;
}

/* Tabela */
table{
  width:100%;
  border-collapse:collapse;
  background:white;
  font-size:14px;
}

th,td{
  padding:8px;
  text-align:left;
}

th{
  background:#111827;
  color:white;
}

tr:nth-child(even){
  background:#f2f2f2;
}

/* Estado com fundo */
.estado{
  padding:4px 8px;
  border-radius:6px;
  color:white;
  font-weight:bold;
  display:inline-block;
}

.estado.em-curso{ background:#dc2626; }
.estado.dominado{ background:#f59e0b; }
.estado.resolvido{ background:#16a34a; }

/* Footer */
footer{
  background:#1f2937;
  color:white;
  text-align:center;
  padding:15px 0;
  margin-top:30px;
}

/* Ícone a piscar */
.blinking-icon{
  animation:blink 1s infinite;
}

@keyframes blink{
  0%{opacity:1;}
  50%{opacity:0.2;}
  100%{opacity:1;}
}
</style>
</head>
<body>

<header>
  <div class="container">
    <h1>Ocorrências ANEPC</h1>
  </div>
</header>

<div class="container">

  <div class="top-cards" id="topCards"></div>

  <div id="map"></div>

  <table>
    <thead>
      <tr>
        <th>Data/Hora</th>
        <th>Distrito</th>
        <th>Concelho</th>
        <th>Natureza</th>
        <th>Estado</th>
        <th>Operacionais</th>
        <th>Terrestres</th>
        <th>Aéreos</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>

<footer>
  <div class="container">
    Dados fornecidos pela ANEPC
  </div>
</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map=L.map('map').setView([39.5,-8],7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
}).addTo(map);

const markers=L.layerGroup().addTo(map);

/* Função distrito simples */
function getDistrito(concelho){
  return concelho || "-";
}

function getEstadoClass(estado){
  if(!estado) return "";
  estado=estado.toLowerCase();
  if(estado.includes("curso")) return "em-curso";
  if(estado.includes("dominado")) return "dominado";
  if(estado.includes("resolvido") || estado.includes("conclus")) return "resolvido";
  return "";
}

function render(data){

  document.getElementById("tbody").innerHTML="";
  document.getElementById("topCards").innerHTML="";
  markers.clearLayers();

  // TOP 3
  const top3=[...data]
    .sort((a,b)=>(b.properties?.Operacionais||0)-(a.properties?.Operacionais||0))
    .slice(0,3);

  top3.forEach(f=>{
    const p=f.properties||{};
    const card=document.createElement("div");
    card.className="top-card";
    card.innerHTML=`
      <div><strong>${p.DataHora||"-"}</strong></div>
      <div>${p.Concelho||"-"}</div>
      <div>${p.Natureza||"-"}</div>
      <div>${p.EstadoOcorrencia||"-"}</div>
      <div><b>Operacionais:</b> ${p.Operacionais||0}</div>
      <div><b>Terrestres:</b> ${p.MeiosTerrestres||0}</div>
      <div><b>Aéreos:</b> ${p.MeiosAereos||0}</div>
    `;
    document.getElementById("topCards").appendChild(card);
  });

  // Tabela + Mapa
  data.forEach(f=>{
    const p=f.properties||{};

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${p.DataHora||"-"}</td>
      <td>${getDistrito(p.Concelho)}</td>
      <td>${p.Concelho||"-"}</td>
      <td>${p.Natureza||"-"}</td>
      <td>
        <span class="estado ${getEstadoClass(p.EstadoOcorrencia)}">
          ${p.EstadoOcorrencia||"-"}
        </span>
      </td>
      <td>${p.Operacionais||0}</td>
      <td>${p.MeiosTerrestres||0}</td>
      <td>${p.MeiosAereos||0}</td>
    `;
    document.getElementById("tbody").appendChild(tr);

    if(f.geometry && f.geometry.coordinates){
      const [lng,lat]=f.geometry.coordinates;

      const popup=`
        <strong>${p.Natureza||"Ocorrência"}</strong><br>
        Estado: ${p.EstadoOcorrencia||"-"}<br>
        Concelho: ${p.Concelho||"-"}<br>
        Operacionais: ${p.Operacionais||0}
      `;

      let marker;

      if(p.EstadoOcorrencia==="Em Curso"){
        const icon=L.divIcon({
          className:'blinking-icon',
          html:`<svg width="30" height="30">
                  <circle cx="15" cy="15" r="8" fill="red"/>
                </svg>`,
          iconSize:[30,30],
          iconAnchor:[15,15]
        });
        marker=L.marker([lat,lng],{icon});
      }else{
        marker=L.circleMarker([lat,lng],{
          radius:8,
          color:"blue",
          fillOpacity:0.9
        });
      }

      marker.bindPopup(popup);
      markers.addLayer(marker);
    }

  });
}

/* EXEMPLO TEMPORÁRIO (substitui pelo fetch da tua API) */
fetch("https://your-backend-url.vercel.app/api/ocorrencias")
  .then(r=>r.json())
  .then(d=>render(d.features))
  .catch(()=>console.log("Erro ao carregar dados"));
</script>

</body>
</html>
