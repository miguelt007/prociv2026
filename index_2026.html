<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROCIV 2026</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<style>
body { margin:0; font-family: Arial, sans-serif; background:#f4f4f4; }
header { padding:15px; background:#111; color:#ffcc00; display:flex; justify-content:space-between; align-items:center; }
header h1 { margin:0; font-size:1.5em; }
header .last-update { font-size:0.9em; color:#fff; }

.cards { display:flex; flex-wrap:wrap; padding:10px; gap:10px; }
.card { flex:1 1 150px; background:#222; color:white; padding:15px; border-radius:6px; text-align:center; }
.card h2 { margin:0; font-size:1.5em; }
.card p { margin:5px 0 0; }

#map { height:400px; margin:10px; border-radius:6px; }

table { width:95%; margin:10px auto 20px auto; border-collapse:collapse; background:white; border-radius:6px; overflow:hidden; }
th, td { padding:8px; border-bottom:1px solid #ddd; text-align:left; }
th { background:#111; color:white; }
tr:nth-child(even) { background:#f9f9f9; }
tr:hover { background:#eee; }

.legend { display:flex; gap:10px; margin:5px 0; flex-wrap:wrap; }
.legend div { display:flex; align-items:center; gap:5px; font-size:0.9em; }
.dot { width:12px; height:12px; border-radius:50%; display:inline-block; }

.yellow { background:yellow; }
.orange { background:orange; }
.red { background:red; }
.blue { background:blue; }
.green { background:green; }

@media(max-width:900px){
  .cards { flex-direction:column; }
}
</style>
</head>
<body>

<header>
  <h1>PROCIV 2026</h1>
  <div class="last-update" id="lastUpdate">Atualizado: --/--/---- --:--:--</div>
</header>

<div class="cards">
  <div class="card">Total<br><h2 id="totalCount">0</h2></div>
  <div class="card">Despacho de 1º Alerta<br><h2 id="alertCount">0</h2></div>
  <div class="card">Em Curso<br><h2 id="cursoCount">0</h2></div>
  <div class="card">Despacho<br><h2 id="despachoCount">0</h2></div>
  <div class="card">Em Resolução<br><h2 id="resolucaoCount">0</h2></div>
  <div class="card">Em Conclusão<br><h2 id="conclusaoCount">0</h2></div>
</div>

<div id="map"></div>

<table id="tabelaOcorrencias">
  <thead>
    <tr>
      <th>Data Criação</th>
      <th>Data Atualização</th>
      <th>Estado</th>
      <th>Distrito</th>
      <th>Concelho</th>
      <th>Freguesia</th>
      <th>Natureza</th>
      <th>Localização</th>
      <th>Operacionais</th>
      <th>Terrestres</th>
      <th>Aéreos</th>
    </tr>
  </thead>
  <tbody>
  </tbody>
</table>

<script>
const API_URL = "https://services-eu1.arcgis.com/VlrHb7fn5ewYhX6y/arcgis/rest/services/OcorrenciasSite/FeatureServer/0/query?f=geojson&where=1=1&outFields=*";

let map = L.map('map').setView([39.5,-8],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markersLayer = L.markerClusterGroup();
map.addLayer(markersLayer);

let allData = [];

function getColor(estado){
  if(!estado) return "blue";
  estado = estado.toLowerCase();
  if(estado.includes("despacho de 1º alerta")) return "yellow";
  if(estado.includes("despacho")) return "orange";
  if(estado.includes("em curso")) return "red";
  if(estado.includes("em resolução")) return "blue";
  if(estado.includes("em conclusão")) return "green";
  return "blue";
}

function atualizarHora(){
  const now = new Date();
  document.getElementById("lastUpdate").textContent = "Atualizado: " + now.toLocaleString('pt-PT');
}

function loadData(){
  fetch(API_URL)
  .then(res=>res.json())
  .then(data=>{
    allData = data.features;
    atualizarHora();
    renderDashboard(allData);
    renderMap(allData);
    renderTabela(allData);
  });
}

function renderDashboard(data){
  document.getElementById("totalCount").textContent = data.length;
  document.getElementById("alertCount").textContent = data.filter(f=>f.properties.Estado==="Despacho de 1º Alerta").length;
  document.getElementById("cursoCount").textContent = data.filter(f=>f.properties.Estado==="Em Curso").length;
  document.getElementById("despachoCount").textContent = data.filter(f=>f.properties.Estado==="Despacho").length;
  document.getElementById("resolucaoCount").textContent = data.filter(f=>f.properties.Estado==="Em Resolução").length;
  document.getElementById("conclusaoCount").textContent = data.filter(f=>f.properties.Estado==="Em Conclusão").length;
}

function renderMap(data){
  markersLayer.clearLayers();
  data.forEach(f=>{
    const p = f.properties;
    const [lng,lat] = f.geometry.coordinates;
    const marker = L.circleMarker([lat,lng],{
      radius:8,
      color:getColor(p.Estado),
      fillOpacity:0.9
    }).bindPopup(`
      <b>${p.Natureza||''}</b><br>
      Estado: ${p.Estado||''}<br>
      Distrito: ${p.Distrito||''}<br>
      Concelho: ${p.Concelho||''}<br>
      Freguesia: ${p.Freguesia||''}<br>
      Localização: ${p.Localizacao||''}<br>
      Data Criação: ${p.DataCriacao||''}<br>
      Data Atualização: ${p.DataAtualizacao||''}<br>
      Operacionais: ${p.Operacionais||0}<br>
      Terrestres: ${p.Terrestres||0}<br>
      Aéreos: ${p.Aereos||0}
    `);
    markersLayer.addLayer(marker);
  });
}

function renderTabela(data){
  const tbody = document.querySelector("#tabelaOcorrencias tbody");
  tbody.innerHTML = "";
  const prioridade = ["Despacho de 1º Alerta","Em Curso","Despacho","Em Resolução","Em Conclusão"];
  const sorted = data.sort((a,b)=> prioridade.indexOf(a.properties.Estado) - prioridade.indexOf(b.properties.Estado));
  sorted.forEach(f=>{
    const p=f.properties;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${p.DataCriacao||''}</td>
      <td>${p.DataAtualizacao||''}</td>
      <td>${p.Estado||''}</td>
      <td>${p.Distrito||''}</td>
      <td>${p.Concelho||''}</td>
      <td>${p.Freguesia||''}</td>
      <td>${p.Natureza||''}</td>
      <td>${p.Localizacao||''}</td>
      <td>${p.Operacionais||0}</td>
      <td>${p.Terrestres||0}</td>
      <td>${p.Aereos||0}</td>
    `;
    tbody.appendChild(tr);
  });
}

loadData();
setInterval(loadData,120000);
</script>

</body>
</html>
