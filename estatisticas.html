<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Ocorrências em Portugal - Estatísticas</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f6f9;
    }

    h1 {
      text-align: center;
      color: #1f3c88;
      margin-bottom: 30px;
      font-size: 1.8em;
    }

    /* Layout tipo dashboard responsivo */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .chart-container {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
      height: 350px;
      position: relative;
    }

    canvas {
      height: 100% !important;
      width: 100% !important;
    }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      h1 { font-size: 1.4em; }
      .chart-container { height: 300px; }
    }
  </style>
</head>
<body>

<h1>📊 Ocorrências em Portugal - Estatísticas</h1>

<div class="grid">

  <div class="chart-container">
    <canvas id="chartRegiao"></canvas>
  </div>

  <div class="chart-container">
    <canvas id="chartTipo"></canvas>
  </div>

  <div class="chart-container" style="grid-column: span 2;">
    <canvas id="chartComparativo"></canvas>
  </div>

</div>

<script>
async function fetchData() {
  const url = "https://services-eu1.arcgis.com/VlrHb7fn5ewYhX6y/arcgis/rest/services/OcorrenciasSite/FeatureServer/0/query?where=1%3D1&outFields=*&outSR=4326&f=geojson";
  const res = await fetch(url);
  const data = await res.json();

  console.log(data.features[0].properties); // verificar nomes exatos dos campos

  return data.features.map(f => f.properties || f.attributes);
}

function groupBy(arr, key) {
  return arr.reduce((acc, item) => {
    const value = item[key] || "N/A";
    acc[value] = (acc[value] || 0) + 1;
    return acc;
  }, {});
}

function sumPorRegiao(arr, campo) {
  return arr.reduce((acc, item) => {
    const regiao = item.Regiao ?? "N/A";
    const valor = parseFloat((item[campo] ?? 0).toString().replace(",", ".")) || 0;
    acc[regiao] = (acc[regiao] || 0) + valor;
    return acc;
  }, {});
}

(async function() {
  const props = await fetchData();

  const colors = {
    regiao: "#4e73df",
    tipo: ["#6f42c1","#1cc88a","#36b9cc","#f6c23e","#e74a3b","#858796"],
    operacionais: "#e74a3b",
    terrestres: "#1cc88a",
    aereos: "#f6c23e"
  };

  // 📍 Ocorrências por Região
  const regiaoCounts = groupBy(props, "Regiao");
  new Chart(document.getElementById("chartRegiao"), {
    type: "bar",
    data: {
      labels: Object.keys(regiaoCounts),
      datasets: [{
        label: "Ocorrências por Região",
        data: Object.values(regiaoCounts),
        backgroundColor: colors.regiao
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        tooltip: {
          enabled: true,
          callbacks: {
            label: function(context) {
              return `${context.dataset.label}: ${context.raw}`;
            }
          }
        }
      },
      scales: {
        y: { beginAtZero: true }
      }
    }
  });

  // 📍 Ocorrências por Tipo
  const tipoCounts = groupBy(props, "Tipo");
  new Chart(document.getElementById("chartTipo"), {
    type: "pie",
    data: {
      labels: Object.keys(tipoCounts),
      datasets: [{
        data: Object.values(tipoCounts),
        backgroundColor: colors.tipo
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        tooltip: {
          enabled: true,
          callbacks: {
            label: function(context) {
              return `${context.label}: ${context.raw}`;
            }
          }
        }
      }
    }
  });

  // 📊 Comparativo: Operacionais + Meios por Região
  const operacionais = sumPorRegiao(props, "Operacionais");
  const terrestres = sumPorRegiao(props, "MeiosTerrestres");
  const aereos = sumPorRegiao(props, "MeiosAereos");

  const regioes = [...new Set([
    ...Object.keys(operacionais),
    ...Object.keys(terrestres),
    ...Object.keys(aereos)
  ])];

  new Chart(document.getElementById("chartComparativo"), {
    type: "bar",
    data: {
      labels: regioes,
      datasets: [
        {
          label: "Operacionais",
          data: regioes.map(r => operacionais[r] || 0),
          backgroundColor: colors.operacionais
        },
        {
          label: "Meios Terrestres",
          data: regioes.map(r => terrestres[r] || 0),
          backgroundColor: colors.terrestres
        },
        {
          label: "Meios Aéreos",
          data: regioes.map(r => aereos[r] || 0),
          backgroundColor: colors.aereos
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        tooltip: {
          enabled: true,
          callbacks: {
            label: function(context) {
              return `${context.dataset.label}: ${context.raw}`;
            }
          }
        },
        legend: { position: "top" }
      },
      scales: {
        y: { beginAtZero: true }
      }
    }
  });

})();
</script>

</body>
</html>
