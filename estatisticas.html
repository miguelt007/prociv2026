<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Ocorrências em Portugal - Estatísticas</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f4f6f9;
    }
    h1 {
      text-align: center;
      color: #1f3c88;
      margin-bottom: 50px;
    }
    .chart-container {
      width: 90%;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>

<h1>📊 Ocorrências em Portugal - Estatísticas</h1>

<div class="chart-container">
  <canvas id="chartRegiao"></canvas>
</div>

<div class="chart-container">
  <canvas id="chartTipo"></canvas>
</div>

<div class="chart-container">
  <canvas id="chartOperacionais"></canvas>
</div>

<div class="chart-container">
  <canvas id="chartTerrestres"></canvas>
</div>

<div class="chart-container">
  <canvas id="chartAereos"></canvas>
</div>

<script>
async function fetchData() {
  const url = "https://services-eu1.arcgis.com/VlrHb7fn5ewYhX6y/arcgis/rest/services/OcorrenciasSite/FeatureServer/0/query?where=1%3D1&outFields=*&outSR=4326&f=geojson";
  const res = await fetch(url);
  const data = await res.json();
  return data.features.map(f => f.properties);
}

function groupBy(arr, key) {
  return arr.reduce((acc, item) => {
    const value = item[key] || "N/A";
    acc[value] = (acc[value] || 0) + 1;
    return acc;
  }, {});
}

function sumPorRegiao(arr, campo) {
  return arr.reduce((acc, item) => {
    const regiao = item.Regiao || "N/A";
    const valor = Number(item[campo]) || 0;
    acc[regiao] = (acc[regiao] || 0) + valor;
    return acc;
  }, {});
}

function createChart(ctx, type, labels, data, label, color) {
  new Chart(ctx, {
    type,
    data: {
      labels,
      datasets: [{
        label,
        data,
        backgroundColor: color
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: true }
      }
    }
  });
}

(async function() {
  const props = await fetchData();

  // 🎨 Cores individuais
  const blue = "#4e73df";
  const green = "#1cc88a";
  const orange = "#f6c23e";
  const red = "#e74a3b";
  const purple = "#6f42c1";

  // 📍 Ocorrências por Região
  const regiaoCounts = groupBy(props, "Regiao");
  createChart(
    document.getElementById("chartRegiao"),
    "bar",
    Object.keys(regiaoCounts),
    Object.values(regiaoCounts),
    "Ocorrências por Região",
    blue
  );

  // 📍 Ocorrências por Tipo
  const tipoCounts = groupBy(props, "Tipo");
  createChart(
    document.getElementById("chartTipo"),
    "pie",
    Object.keys(tipoCounts),
    Object.values(tipoCounts),
    "Ocorrências por Tipo",
    purple
  );

  // 🚒 Operacionais por Região
  const operacionais = sumPorRegiao(props, "Operacionais");
  createChart(
    document.getElementById("chartOperacionais"),
    "bar",
    Object.keys(operacionais),
    Object.values(operacionais),
    "Total de Operacionais por Região",
    red
  );

  // 🚓 Meios Terrestres por Região
  const terrestres = sumPorRegiao(props, "MeiosTerrestres");
  createChart(
    document.getElementById("chartTerrestres"),
    "bar",
    Object.keys(terrestres),
    Object.values(terrestres),
    "Total de Meios Terrestres por Região",
    green
  );

  // 🚁 Meios Aéreos por Região
  const aereos = sumPorRegiao(props, "MeiosAereos");
  createChart(
    document.getElementById("chartAereos"),
    "bar",
    Object.keys(aereos),
    Object.values(aereos),
    "Total de Meios Aéreos por Região",
    orange
  );

})();
</script>

</body>
</html>
