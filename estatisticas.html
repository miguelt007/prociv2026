<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Ocorrências em Portugal - Estatísticas</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f4f6f9;
    }
    h1 {
      text-align: center;
      color: #1f3c88;
      margin-bottom: 50px;
    }
    .chart-container {
      width: 90%;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>

<h1>📊 Ocorrências em Portugal - Estatísticas</h1>

<div class="chart-container">
  <canvas id="chartRegiao"></canvas>
</div>

<div class="chart-container">
  <canvas id="chartTipo"></canvas>
</div>

<div class="chart-container">
  <canvas id="chartMeiosRegiao"></canvas>
</div>

<script>
async function fetchData() {
  const url = "https://services-eu1.arcgis.com/VlrHb7fn5ewYhX6y/arcgis/rest/services/OcorrenciasSite/FeatureServer/0/query?where=1%3D1&outFields=*&outSR=4326&f=geojson";
  const res = await fetch(url);
  const data = await res.json();
  return data.features.map(f => f.properties);
}

function groupBy(arr, key) {
  return arr.reduce((acc, item) => {
    const value = item[key] || "N/A";
    acc[value] = (acc[value] || 0) + 1;
    return acc;
  }, {});
}

function sumMeiosPorRegiao(arr) {
  return arr.reduce((acc, item) => {
    const regiao = item.Regiao || "N/A";
    const meios = Number(item.Meios) || 0;  // <- ajusta aqui se o nome for diferente
    acc[regiao] = (acc[regiao] || 0) + meios;
    return acc;
  }, {});
}

function createChart(ctx, type, labels, data, label, colorSet) {
  new Chart(ctx, {
    type,
    data: {
      labels,
      datasets: [{
        label,
        data,
        backgroundColor: colorSet
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: true }
      }
    }
  });
}

(async function() {
  const props = await fetchData();

  const colors = [
    "#4e73df","#1cc88a","#36b9cc","#f6c23e",
    "#e74a3b","#858796","#fd7e14","#20c997"
  ];

  // 📍 Ocorrências por Região
  const regiaoCounts = groupBy(props, "Regiao");
  createChart(
    document.getElementById("chartRegiao"),
    "bar",
    Object.keys(regiaoCounts),
    Object.values(regiaoCounts),
    "Ocorrências por Região",
    colors
  );

  // 📍 Ocorrências por Tipo
  const tipoCounts = groupBy(props, "Tipo");
  createChart(
    document.getElementById("chartTipo"),
    "pie",
    Object.keys(tipoCounts),
    Object.values(tipoCounts),
    "Ocorrências por Tipo",
    colors
  );

  // 🚒 Meios por Região
  const meiosRegiao = sumMeiosPorRegiao(props);
  createChart(
    document.getElementById("chartMeiosRegiao"),
    "bar",
    Object.keys(meiosRegiao),
    Object.values(meiosRegiao),
    "Total de Meios por Região",
    colors
  );

})();
</script>

</body>
</html>
